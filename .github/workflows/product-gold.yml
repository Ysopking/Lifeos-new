name: LIFEOS Product Gold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lifeos-product-gold-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-gold:
    name: LIFEOS Product Gold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOLD_RUN_ID: ${{ github.run_id }}
      GOLD_JOB: product-gold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reuse exact-head validation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .github/scripts/fetch-sibling-gold-inputs.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${SOURCE_HEAD_SHA}" \
            --current-run-id "${GOLD_RUN_ID}" \
            --out product-gold-evidence/sibling-runs.json
      - name: Product Gold evidence preflight
        shell: bash
        run: bash .github/scripts/ci-product-gold.sh
      - name: Seal Product Gold evidence
        shell: bash
        run: |
          python3 .github/scripts/seal-gold-evidence.py final \
            --pre product-gold-evidence/pre-emulator.json \
            --emulator-root android-emulator-recovery \
            --out product-gold-evidence/product-gold.json
          test -s product-gold-evidence/product-gold.json
      - name: Upload Product Gold debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-PRODUCT-GOLD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Product Gold evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-PRODUCT-GOLD-evidence
          path: |
            product-gold-evidence/
            android-emulator-recovery/
            **/build/test-results/**/TEST-*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30
