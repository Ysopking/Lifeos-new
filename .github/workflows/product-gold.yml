name: LIFEOS Product Gold

on:
  pull_request:
    branches:
      - main
      - lifeos/optimization-round-2
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-product-gold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOLD_RUN_ID: ${{ github.run_id }}
      GOLD_JOB: product-gold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.3.1"
      - name: Product Gold pre-emulator matrix
        shell: bash
        run: bash .github/scripts/ci-product-gold.sh
      - name: Product Gold cold-restart end-to-end
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: sh .github/scripts/android-emulator-recovery.sh
      - name: Seal Product Gold evidence
        shell: bash
        run: |
          printf '%s\n' \
            'emulator_cold_restart=PASS' \
            'product_chat_roundtrip=PASS' \
            'conversation_rehydration=PASS' \
            'thought_matrix_rehydration=PASS' \
            'runtime_topology=PASS' \
            'self_healing_recovery=PASS' \
            'controlled_evolution_recovery=PASS' \
            'offline_image_artifact_e2e=PASS' \
            'field_snapshot_atomic_recovery=PASS' >> product-gold-evidence/gates.txt
          printf 'product_gold=PASS\n' >> product-gold-evidence/gates.txt
      - name: Upload Product Gold debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LIFEOS-PRODUCT-GOLD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Product Gold evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LIFEOS-PRODUCT-GOLD-evidence
          path: |
            product-gold-evidence/
            android-emulator-recovery/
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30
