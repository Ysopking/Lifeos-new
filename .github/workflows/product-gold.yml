name: LIFEOS Product Gold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-product-gold-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-gold:
    name: LIFEOS Product Gold
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOLD_RUN_ID: ${{ github.run_id }}
      GOLD_JOB: product-gold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.3.1"
      - name: Product Gold pre-emulator matrix
        shell: bash
        run: bash .github/scripts/ci-product-gold.sh
      - name: Product Gold cold-restart end-to-end
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: sh .github/scripts/android-emulator-recovery.sh
      - name: Seal Product Gold evidence
        shell: bash
        run: |
          printf '%s\n' \
            'emulator_cold_restart=PASS' \
            'product_chat_roundtrip=PASS' \
            'conversation_rehydration=PASS' \
            'thought_matrix_rehydration=PASS' \
            'runtime_topology=PASS' \
            'self_healing_recovery=PASS' \
            'controlled_evolution_recovery=PASS' \
            'offline_image_artifact_e2e=PASS' \
            'field_snapshot_atomic_recovery=PASS' \
            'semantic_action_recovery=PASS' \
            'semantic_reference_revision_recovery=PASS' \
            'external_effect_no_duplicate=PASS' \
            'language_gold_device=PASS' \
            'language_runtime_process_death=PASS' \
            'language_runtime_rollback=PASS' \
            'personal_language_feedback=PASS' \
            'web_contradiction_detection=PASS' \
            'web_source_diversity=PASS' \
            'web_evidence_cache=PASS' \
            'level7_productive_world_persistence=PASS' \
            'level7_process_death_semantics=PASS' \
            'level7_world_equation_rollback=PASS' \
            'level7_truth_closure_gold=PASS' \
            'world_equation_auto_evolution_recovery=PASS' \
            'self_observation_gold=PASS' \
            'level7_functional_gold=PASS' \
            'escalation_functional_gold=PASS' >> product-gold-evidence/gates.txt
          printf 'product_gold=PASS\n' >> product-gold-evidence/gates.txt
      - name: Upload Product Gold debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-PRODUCT-GOLD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Product Gold evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-PRODUCT-GOLD-evidence
          path: |
            product-gold-evidence/
            android-emulator-recovery/
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30
