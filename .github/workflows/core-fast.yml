name: Core Fast Gate

on:
  push:
    paths:
      - "core/**"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/src/androidTest/**"
      - "app/build.gradle*"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/ci-core-fast.sh"
      - ".github/scripts/ci-gold-coverage-contract.sh"
      - ".github/scripts/ci-action-pin-contract.sh"
      - ".github/scripts/android-emulator-recovery.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.3.1"
      - name: Core fast gate
        shell: bash
        run: bash .github/scripts/ci-core-fast.sh
