name: Core Fast Gate

on:
  push:
    paths:
      - "core/**"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle*"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/ci-core-fast.sh"
      - ".github/scripts/ci-gold-coverage-contract.sh"
      - ".github/workflows/core-fast.yml"
      - ".github/workflows/android-emulator-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Core fast gate
        shell: bash
        run: bash .github/scripts/ci-core-fast.sh
