name: Core Fast Gate

on:
  push:
    paths:
      - "core/**"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/src/androidTest/**"
      - "app/build.gradle*"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/ci-core-fast.sh"
      - ".github/scripts/ci-gold-coverage-contract.sh"
      - ".github/scripts/ci-action-pin-contract.sh"
      - ".github/scripts/android-emulator-recovery.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.3.1"
      - name: Core fast gate
        shell: bash
        run: bash .github/scripts/ci-core-fast.sh
