name: F11 Accessibility Device Gate
on:
  pull_request:
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/app/lifeos/next/ui/**"
      - ".github/workflows/f11-accessibility.yml"
permissions:
  contents: read
jobs:
  accessibility-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.3.1"
      - name: Build accessibility test inputs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run accessibility device contract
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # android-emulator-runner executes this script line-by-line on the ATD host. Keep the
            # launcher proof deliberately linear: am-start exit status, short stabilization delay,
            # a live LIFEOS process, then ActivityManager evidence. First-launch permission UI is
            # allowed to own foreground focus, but an absent LIFEOS process still fails closed.
            adb shell am start -n app.lifeos.next/.ChatMainActivity > f11-launcher.txt 2>&1
            sleep 2
            adb shell pidof app.lifeos.next | tr -d '\r' | tee f11-process.txt | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities > f11-activities.txt
            grep -Eq 'app\.lifeos\.next/(\.|app\.lifeos\.next\.)ChatMainActivity|com\.android\.permissioncontroller/.permission\.ui\.GrantPermissionsActivity' f11-activities.txt
            adb shell am force-stop app.lifeos.next
            adb shell am instrument -w -e class app.lifeos.next.LifeOsFrontendAccessibilityDeviceTest app.lifeos.next.test/androidx.test.runner.AndroidJUnitRunner | tee f11-accessibility.txt
            grep -q 'OK (1 test)' f11-accessibility.txt
