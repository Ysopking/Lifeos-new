name: F11 Accessibility Device Gate
on:
  pull_request:
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/app/lifeos/next/ui/**"
      - ".github/workflows/f11-accessibility.yml"
permissions:
  contents: read
jobs:
  accessibility-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.3.1"
      - name: Build accessibility test inputs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run accessibility device contract
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # First prove the productive launcher with the real LifeOsApplication. This remains a
            # separate failure boundary from the pure accessibility contract below.
            adb logcat -c
            adb shell am start -n app.lifeos.next/.ChatMainActivity > f11-launcher.txt 2>&1
            timeout 30 sh -c 'until adb shell pidof app.lifeos.next 2>/dev/null | tr -d "\r" | tee f11-process.txt | grep -Eq "[0-9]+"; do sleep 2; done' || (adb shell dumpsys activity activities > f11-activities-timeout.txt; adb logcat -d > f11-logcat-timeout.txt; exit 1)
            adb shell dumpsys activity activities > f11-activities.txt
            grep -Eq 'app\.lifeos\.next/(\.|app\.lifeos\.next\.)ChatMainActivity|com\.android\.permissioncontroller/.permission\.ui\.GrantPermissionsActivity' f11-activities.txt
            adb shell am force-stop app.lifeos.next
            # The default AndroidJUnitRunner remains registered for all product/recovery suites.
            # F11 alone uses an explicitly registered lightweight runner because this contract only
            # reads accessibility constants and must not boot the entire kernel a second time.
            adb shell pm list instrumentation app.lifeos.next > f11-instrumentations.txt
            grep -q 'app.lifeos.next.test/app.lifeos.next.LifeOsAccessibilityContractRunner' f11-instrumentations.txt
            adb logcat -c
            adb shell am instrument -w -e class app.lifeos.next.LifeOsFrontendAccessibilityDeviceTest app.lifeos.next.test/app.lifeos.next.LifeOsAccessibilityContractRunner | tee f11-accessibility.txt
            adb logcat -d -t 400 > f11-instrumentation-logcat.txt
            grep -q 'OK (1 test)' f11-accessibility.txt || (cat f11-instrumentation-logcat.txt; exit 1)
      - name: Upload F11 accessibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-F11-accessibility-evidence
          path: |
            f11-*.txt
          if-no-files-found: warn
          retention-days: 30
