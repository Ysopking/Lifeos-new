name: F11 Accessibility Device Gate
on:
  pull_request:
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/app/lifeos/next/ui/**"
      - ".github/workflows/f11-accessibility.yml"
permissions:
  contents: read
jobs:
  accessibility-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.3.1"
      - name: Build accessibility test inputs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run accessibility device contract
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Do not depend on `am start -W` text output: on slow AOSP ATD images it can
            # return exit 0 with an empty stdout after waiting for the first permission overlay.
            # Process liveness + ActivityManager state below are the actual launcher proof.
            adb shell am start -n app.lifeos.next/.ChatMainActivity > f11-launcher.txt 2>&1
            pid=""
            for attempt in $(seq 1 40); do
              pid="$(adb shell pidof app.lifeos.next 2>/dev/null | tr -d '\r' || true)"
              test -n "$pid" && break
              sleep 0.25
            done
            test -n "$pid"
            printf '%s\n' "$pid" > f11-process.txt
            activities="$(adb shell dumpsys activity activities)"
            printf '%s\n' "$activities" > f11-activities.txt
            if ! printf '%s\n' "$activities" | grep -Eq 'app\.lifeos\.next/(\.|app\.lifeos\.next\.)ChatMainActivity'; then
              printf '%s\n' "$activities" | grep -q 'com.android.permissioncontroller/.permission.ui.GrantPermissionsActivity'
            fi
            adb shell am force-stop app.lifeos.next
            adb shell am instrument -w -e class app.lifeos.next.LifeOsFrontendAccessibilityDeviceTest app.lifeos.next.test/androidx.test.runner.AndroidJUnitRunner | tee f11-accessibility.txt
            grep -q 'OK (1 test)' f11-accessibility.txt
