name: Export LIFEOS Gradle Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-gradle-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Resolve dependencies and build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          gradle test :app:lintDebug :app:assembleDebug \
            --stacktrace \
            --refresh-dependencies

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare portable Gradle dependency cache
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -
