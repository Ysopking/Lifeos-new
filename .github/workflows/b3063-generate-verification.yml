name: B306.3 Generate Dependency Verification Metadata

on:
  push:
    branches:
      - preflight/b306-3-metadata-generation

permissions:
  contents: write

concurrency:
  group: b306-3-verification-metadata
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.3.1"
      - name: Generate SHA-256 dependency verification metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew --write-verification-metadata sha256 \
            :core:model:test \
            :core:field:test \
            :core:runtime:test \
            :core:runtime-contracts:test \
            :core:runtime-deepsearch:test \
            :core:runtime-buildstudio:test \
            :core:runtime-personal:test \
            :core:language:test \
            :core:scene:test \
            :core:data:testDebugUnitTest \
            :host:buildstudio:test \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            --stacktrace
          test -s gradle/verification-metadata.xml
      - name: Verify strict replay
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew --offline --dependency-verification=strict \
            :core:runtime-deepsearch:test \
            :core:runtime:test \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace
      - name: Commit generated metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "verification metadata unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "B306.3: generate Gradle dependency verification metadata"
          git push origin HEAD:preflight/b306-3-metadata-generation
