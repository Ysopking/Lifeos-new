name: Android Emulator Recovery
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/android-emulator-recovery.yml"
      - ".github/scripts/android-emulator-recovery.sh"
      - ".github/scripts/ci-emulator-preflight.sh"
      - "app/src/androidTest/**"
      - "app/src/main/java/app/lifeos/next/ChatMainActivity.kt"
      - "app/src/main/java/app/lifeos/next/ui/**"
      - "app/src/main/java/app/lifeos/next/LifeOsApplication.kt"
      - "app/src/main/java/app/lifeos/next/LifeOsStartupComposition.kt"
      - "app/src/main/java/app/lifeos/next/LifeOsRuntimeWiring.kt"
      - "app/src/main/java/app/lifeos/next/kernel/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/ThoughtMatrix*.kt"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/artifact/**"
      - "core/runtime/src/test/kotlin/app/lifeos/core/runtime/artifact/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/checkpoints/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/thought/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/topology/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/workers/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/capability/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/evolution/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/goal/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/deepsearch/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/resource/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/world/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/trace/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/hardening/**"
      - "core/runtime/src/test/kotlin/app/lifeos/core/runtime/hardening/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/thought/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/capability/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/evolution/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/goal/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/deepsearch/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/resource/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/world/**"
permissions:
  contents: read
concurrency:
  group: android-emulator-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-emulator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.3.1"
      - name: Build and prepare emulator recovery inputs
        shell: bash
        run: bash .github/scripts/ci-emulator-preflight.sh
      - name: Bounded ACTIVE cold-restart recovery
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: sh .github/scripts/android-emulator-recovery.sh
      - name: Upload Android emulator recovery reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LIFEOS-android-emulator-recovery
          path: android-emulator-recovery/
          if-no-files-found: warn
          retention-days: 14
