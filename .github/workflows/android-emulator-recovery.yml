name: Android Emulator Recovery
on:
  pull_request:
    paths:
      - ".github/workflows/android-emulator-recovery.yml"
      - ".github/scripts/android-emulator-recovery.sh"
      - "app/src/androidTest/**"
      - "app/src/main/java/app/lifeos/next/LifeOsApplication.kt"
      - "app/src/main/java/app/lifeos/next/kernel/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/ThoughtMatrix*.kt"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/checkpoints/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/thought/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/workers/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/capability/**"
      - "core/runtime/src/main/kotlin/app/lifeos/core/runtime/evolution/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/thought/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/capability/**"
      - "core/data/src/main/kotlin/app/lifeos/core/data/evolution/**"
permissions:
  contents: read
concurrency:
  group: android-emulator-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-emulator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build recovery APKs before emulator boot
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable; emulator runner may fall back to software acceleration."
          fi
      - name: Free disk for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$sdk_root/ndk" "$sdk_root/cmake"
          df -h /
      - name: Bounded ACTIVE cold-restart recovery
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: sh .github/scripts/android-emulator-recovery.sh
      - name: Upload Android emulator recovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIFEOS-android-emulator-recovery
          path: android-emulator-recovery/
          if-no-files-found: warn
          retention-days: 14
