name: G08 Generate Gradle Wrapper
on:
  push:
    branches:
      - restack/g08-gradle-wrapper-after-docs
permissions:
  contents: write
jobs:
  generate-wrapper:
    if: ${{ !contains(github.event.head_commit.message, 'generate Gradle wrapper 9.3.1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: restack/g08-gradle-wrapper-after-docs
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.3.1"
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "wrapper-already-current"
            exit 0
          fi
          git commit -m "G08: generate Gradle wrapper 9.3.1"
          git push origin HEAD:restack/g08-gradle-wrapper-after-docs
