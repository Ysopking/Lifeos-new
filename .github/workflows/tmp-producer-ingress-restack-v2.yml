name: Temporary Producer Ingress Restack V2
on:
  push:
    branches:
      - automation/producer-ingress-restack
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply current-tree producer ingress audit
        shell: bash
        run: |
          git fetch origin lifeos/full-audit-producer-ingress-v1
          git checkout origin/lifeos/full-audit-producer-ingress-v1 -- \
            app/src/main/java/app/lifeos/next/kernel/ProductivePhotonIngressClassification.kt \
            app/src/test/java/app/lifeos/next/kernel/ProductivePhotonIngressClassificationTest.kt
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          p = Path('app/src/main/java/app/lifeos/next/kernel/LifeOsKernel.kt')
          s = p.read_text()
          s = one(s, 'import app.lifeos.core.runtime.LifeOsRuntime\n', 'import app.lifeos.core.runtime.LifeOsRuntime\nimport app.lifeos.core.runtime.PhotonIngressMode\n', 'import')
          s = one(s,
              '''    private val localImageTransformExecutor = LocalImageTransformActionExecutor(\n        photons = photonStore,\n        assets = imageAssets,\n        persistAndIngest = ::persistAndIngest,\n    )''',
              '''    private val localImageTransformExecutor = LocalImageTransformActionExecutor(\n        photons = photonStore,\n        assets = imageAssets,\n        persistAndIngest = { photon ->\n            persistAndIngest(photon, PhotonIngressMode.DERIVED)\n        },\n    )''', 'image transform')
          s = one(s,
              '''    private val localScheduleExecutor = LocalScheduleActionExecutor(\n        scheduler = localReminderScheduler,\n        persistAndIngest = ::persistAndIngest,\n    )''',
              '''    private val localScheduleExecutor = LocalScheduleActionExecutor(\n        scheduler = localReminderScheduler,\n        persistAndIngest = { photon ->\n            persistAndIngest(photon, PhotonIngressMode.DERIVED)\n        },\n    )''', 'schedule')
          s = one(s, '            val goal = persistAndIngest(goalPhoton.photon)\n', '            val goal = persistAndIngest(goalPhoton.photon, PhotonIngressMode.DERIVED)\n', 'goal')
          s = one(s,
              '''    suspend fun recordCommunicationHandoff(share: LocalSharePreparation): PhotonSubmissionResult =\n        persistAndIngest(localCommunicationGoalEngine.createHandoffReceipt(share))''',
              '''    suspend fun recordCommunicationHandoff(share: LocalSharePreparation): PhotonSubmissionResult =\n        persistAndIngest(\n            localCommunicationGoalEngine.createHandoffReceipt(share),\n            PhotonIngressMode.DERIVED,\n        )''', 'communication')
          s = one(s,
              '''    suspend fun persistAndIngest(photon: Photon): PhotonSubmissionResult {\n        val previous = photonStore.load(photon.id)''',
              '''    /** Backward-compatible external boundary: direct submissions are ORIGIN. */\n    suspend fun persistAndIngest(photon: Photon): PhotonSubmissionResult =\n        persistAndIngest(photon, PhotonIngressMode.ORIGIN)\n\n    internal suspend fun persistAndIngest(\n        photon: Photon,\n        mode: PhotonIngressMode,\n    ): PhotonSubmissionResult {\n        ProductivePhotonIngressClassification.requireOrMark(photonStore, photon, mode)\n        val previous = photonStore.load(photon.id)''', 'kernel boundary')
          s = one(s, '                    val resumedGoal = persistAndIngest(result.resumedPhoton)\n', '''                    val resumedGoal = persistAndIngest(\n                        result.resumedPhoton,\n                        PhotonIngressMode.DERIVED,\n                    )\n''', 'resume')
          old_output = '                    output = persistAndIngest(result.photon),\n'
          if s.count(old_output) != 2:
              raise SystemExit(f"knowledge/deep-search outputs: expected 2 matches, found {s.count(old_output)}")
          s = s.replace(old_output, '                    output = persistAndIngest(result.photon, PhotonIngressMode.DERIVED),\n')
          p.write_text(s)

          p = Path('app/src/main/java/app/lifeos/next/kernel/CanonicalPhotonIngress.kt')
          s = p.read_text()
          s = one(s, 'import app.lifeos.core.runtime.PhotonIngressMarkerStore\n', '', 'canonical import')
          start = s.index('        val durableMode = PhotonIngressMarkerStore.mode(kernel.photonStore, photon)\n')
          end = s.index('        val live = kernel.bootstrapState.value.photons.firstOrNull', start)
          s = s[:start] + s[end:]
          s = one(s, '        val submission = kernel.persistAndIngest(photon)\n', '        val submission = kernel.persistAndIngest(photon, mode)\n', 'canonical call')
          p.write_text(s)

          p = Path('app/src/main/java/app/lifeos/next/LifeOsApplication.kt')
          s = p.read_text()
          marker = '''                                override suspend fun save(photon: Photon) {\n                                    photonIngress.ingest(photon, PhotonIngressMode.ORIGIN)\n                                }'''
          s = one(s, marker, marker.replace('PhotonIngressMode.ORIGIN', 'PhotonIngressMode.DERIVED'), 'deep search result')
          p.write_text(s)
          PY
          rm -f .github/workflows/tmp-producer-ingress-restack.yml .github/workflows/tmp-producer-ingress-restack-v2.yml
          git diff --check
      - name: Commit clean audit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Audit: classify internal Photon producers at kernel boundary"
          git push origin HEAD:automation/producer-ingress-restack
