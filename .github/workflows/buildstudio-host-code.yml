name: BuildStudio Host Code Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'host/buildstudio/**'
      - 'core/runtime/src/main/kotlin/app/lifeos/core/runtime/buildstudio/**'
      - 'core/runtime/src/main/kotlin/app/lifeos/core/runtime/capability/**'
      - 'core/runtime/src/main/kotlin/app/lifeos/core/runtime/evolution/**'
      - 'core/runtime/src/test/kotlin/app/lifeos/core/runtime/buildstudio/**'
      - 'core/runtime/src/test/kotlin/app/lifeos/core/runtime/capability/**'
      - 'core/runtime/src/test/kotlin/app/lifeos/core/runtime/evolution/**'
      - '.github/workflows/buildstudio-host-code.yml'

permissions:
  contents: read

concurrency:
  group: buildstudio-host-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-code-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.3.1'

      - name: Verify BuildStudio host and runtime trust boundary
        shell: bash
        run: |
          set -euo pipefail
          gradle :host:buildstudio:test :core:runtime:test --stacktrace
